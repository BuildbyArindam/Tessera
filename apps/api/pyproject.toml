[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-api"
version = "0.1.0"
description = "FastAPI service: invoices, forecasts, plan runs, proposals, approvals and the audit log."
requires-python = ">=3.11"
dependencies = [
    "tessera-core",
    "tessera-store",
    "tessera-audit",
    "tessera-agent",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["tessera_api*"]
