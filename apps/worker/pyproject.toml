[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-worker"
version = "0.1.0"
description = "Scheduler: forecast, plan, execute, reconcile. The only caller of tessera_airwallex."
requires-python = ">=3.11"
dependencies = ["tessera-core", "tessera-agent", "tessera-airwallex", "tessera-audit"]

[tool.setuptools.packages.find]
include = ["tessera_worker*"]
