# postgres: the application database (Day 11). api, worker and web services are added on Days 13 to 16.
# postgres-test: a throwaway database for the integration tests, in memory, only with `--profile test`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: tessera
      POSTGRES_DB: tessera
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera -d tessera"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-test:
    profiles: ["test"]
    image: postgres:16
    environment:
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: tessera
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
