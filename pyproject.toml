[tool.pytest.ini_options]
pythonpath = ["packages/core", "packages/evalkit", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/core:packages/evalkit:packages/agent"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["lightgbm.*", "sklearn.*", "pandas.*", "anthropic.*"]
ignore_missing_imports = true
