[tool.pytest.ini_options]
pythonpath = ["packages/core", "packages/evalkit", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # generated constraint text

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/core:packages/evalkit:packages/agent:packages/store:packages/audit:apps/api"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["lightgbm.*", "sklearn.*", "pandas.*", "anthropic.*"]
ignore_missing_imports = true
