[tool.pytest.ini_options]
pythonpath = ["packages/core", "packages/evalkit", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # generated constraint text
# Day 19: files whose lines are mostly report/transcript prose in string literals (ruff format cannot wrap those)
"packages/evalkit/tessera_evalkit/agent_eval/*" = ["E501"]
"apps/worker/tessera_worker/demo_stack.py" = ["E501"]
"scripts/demo.py" = ["E501"]
"scripts/verify_day*.py" = ["E501"]  # one-off verification transcripts
"scripts/build_scenarios.py" = ["E501"]
"scripts/serve_day19_demo.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/core:packages/airwallex:packages/evalkit:packages/agent:packages/store:packages/audit:apps/api:apps/worker"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["lightgbm.*", "sklearn.*", "pandas.*", "anthropic.*"]
ignore_missing_imports = true
