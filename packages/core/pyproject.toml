[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-core"
version = "0.1.0"
description = "Pure domain and decision logic for Tessera. No network, no database."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[tool.setuptools.packages.find]
include = ["tessera_core*"]

[tool.setuptools.package-data]
tessera_core = ["py.typed"]
