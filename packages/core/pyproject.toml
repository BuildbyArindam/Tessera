[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-core"
version = "0.1.0"
description = "Pure domain and decision logic for Tessera. No network, no database."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "lightgbm>=4.3", "pyyaml>=6"]

[tool.setuptools.packages.find]
include = ["tessera_core*"]

[tool.setuptools.package-data]
tessera_core = ["py.typed", "policy/rules/*.yaml"]
