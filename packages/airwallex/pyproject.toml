[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-airwallex"
version = "0.1.0"
description = "Airwallex execution port plus mock and sandbox adapters."
requires-python = ">=3.11"
dependencies = ["tessera-core", "pydantic>=2.7"]

[tool.setuptools.packages.find]
include = ["tessera_airwallex*"]

[tool.setuptools.package-data]
tessera_airwallex = ["py.typed"]
