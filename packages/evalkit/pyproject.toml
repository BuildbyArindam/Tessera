[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-evalkit"
version = "0.1.0"
description = "Tessera evaluation kit: synthetic data, FX history, metrics, red-team runner"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "numpy>=1.26", "pyarrow>=15"]

[project.optional-dependencies]
report = ["pandas>=2.1", "matplotlib>=3.8"]
# The red-team runner drives the real planner and policy engine (it never imports the Airwallex package).
redteam = ["tessera-core", "tessera-agent", "pandas>=2.1"]

[tool.setuptools.packages.find]
include = ["tessera_evalkit*"]

[tool.setuptools.package-data]
tessera_evalkit = ["redteam/*.jsonl"]
