[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-audit"
version = "0.1.0"
description = "Hash-chained, append-only audit log."
requires-python = ">=3.11"
dependencies = ["tessera-core"]

[tool.setuptools.packages.find]
include = ["tessera_audit*"]
