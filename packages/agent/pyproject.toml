[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-agent"
version = "0.1.0"
description = "LLM planner. Proposes actions; can never execute them."
requires-python = ">=3.11"
dependencies = ["tessera-core", "pydantic>=2.7"]

[tool.setuptools.packages.find]
include = ["tessera_agent*"]
